<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transmissão ao vivo</title>
    <meta name="theme-color" content="#f23f43" />
    <meta property="og:title" content="🔴 Transmissão ao vivo" />
    <meta property="og:description" content="Clique para assistir no navegador, com vídeo e som." />
    <link rel="stylesheet" href="/css/estilo.css" />
    <script type="module" src="/js/assistir.js"></script>
  </head>
  <body>
    <main>
      <div class="cabecalho">
        <div>
          <h1 id="titulo">Transmissão</h1>
          <p class="suave" id="detalhe">Carregando…</p>
        </div>
        <span class="selo" id="selo" data-estado="carregando">…</span>
      </div>

      <div class="palco" id="palco">
        <video id="video" playsinline controls></video>
        <div class="sobreposicao" id="sobreposicao">
          <div>
            <p id="mensagem">Conectando…</p>
            <button class="grande" id="assistir" hidden>▶ Assistir</button>
            <form class="senha" id="senha" hidden>
              <input type="password" id="campoSenha" placeholder="Senha para assistir" autocomplete="current-password" required />
              <button type="submit">Entrar</button>
            </form>
          </div>
        </div>
      </div>

      <div class="barra">
        <button type="button" class="secundario" id="telaCheia" title="Tela cheia (F ou duplo clique)" disabled>⛶ Tela cheia</button>
        <button type="button" class="secundario" id="flutuante" title="Janela flutuante (P)" disabled hidden>🗗 Janela flutuante</button>
        <span class="suave atalhos">Atalhos: F tela cheia · P janela flutuante</span>
      </div>
    </main>
  </body>
</html>
