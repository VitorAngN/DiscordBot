version: 2
updates:
  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: monthly
    commit-message:
      prefix: build(bot)
    groups:
      discord:
        patterns: ["discord.js", "@discordjs/*", "@snazzah/davey"]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    commit-message:
      prefix: build(server)
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]

  - package-ecosystem: nuget
    directory: /app
    schedule:
      interval: monthly
    commit-message:
      prefix: build(app)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
